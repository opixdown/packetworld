<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3EEE4" />
    <meta name="description" content="PacketWorld: learn computer networking by watching it happen. Interactive simulations of DNS, TCP, TLS and HTTP." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Link previews (X, LinkedIn, WhatsApp, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://packetworld.vercel.app/" />
    <meta property="og:title" content="PacketWorld · See how the internet works" />
    <meta property="og:description" content="Type a URL and watch every packet: DNS, TCP, TLS and HTTP, one step at a time. Free and open source." />
    <meta property="og:image" content="https://packetworld.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PacketWorld · See how the internet works" />
    <meta name="twitter:description" content="Type a URL and watch every packet: DNS, TCP, TLS and HTTP, one step at a time." />
    <meta name="twitter:image" content="https://packetworld.vercel.app/og.png" />
    <title>PacketWorld · See how the internet works</title>
    <script>
      // Apply the visitor's chosen theme before first paint (light by default). See src/state/theme.tsx.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('pw.theme.choice') === '"dark"' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
